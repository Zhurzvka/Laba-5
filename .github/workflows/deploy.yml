name: Deploy static site

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate HTML, CSS and JS modules (Linting check)
        run: |
          echo "Проверка наличия обязательных модулей проекта ТПА-Мастер..."
          test -f index.html && test -f style.css
          grep -qi "<!DOCTYPE html>" index.html
          echo "Проверка структуры HTML/CSS успешно пройдена!"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        run: echo "Deployed successfully to https://zhurzvka.github.io/Laba-5/"
