name: Deploy static site

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate HTML, CSS and JS modules (Linting check)
        run: |
          echo "Проверка наличия обязательных модулей проекта ТПА-Мастер..."
          test -f index.html && test -f styles.css && test -f main.js
          grep -q "<!DOCTYPE html>" index.html
          grep -q "styles.css" index.html
          grep -q "main.js" index.html
          echo "Проверка структуры HTML/CSS/JS успешно пройдена!"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
